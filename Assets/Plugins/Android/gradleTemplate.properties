org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**

# Avast scans HTTPS by re-signing every certificate with its own, which Java
# does not trust - so Gradle could not download anything it had not already
# cached, and the build failed the first time a new library was needed.
# Tools/cacerts is Java's own list of trusted certificates with Avast's added.
# Delete these two lines on a machine without Avast; a build that cannot find
# this file falls back to the default list.
systemProp.javax.net.ssl.trustStore=C:/Users/mysta/OneDrive/Dokumente/GitHub/Scrabby_New/Tools/cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
# Android Resolver Properties Start
android.useAndroidX=true
android.enableJetifier=true
# Android Resolver Properties End
**ADDITIONAL_PROPERTIES**
