<title>PROTOTYPE — option panel</title>
<!--
  THROWAWAY PROTOTYPE. Not shipped code. Double-click to run.

  The option panel (Solo / Multiplayer) in the language the pregame card now
  uses: glass over the real backdrop, letter tiles, amber for an action and
  green only for a confirmed state. ?variant=1|2|3|4 or the bar at the bottom.

  What it has to carry:
    OptionPanel      TitleText, SoloButton, MultiplayerButton
    DifficultyPanel  EasyButton, MediumButton, HardButton, ExpertButton, BackButton

  Variant 4 folds the difficulty panel into this one, which would remove a
  screen from the flow entirely - worth seeing before keeping them separate.
-->
<style>
  :root{
    --ink:#e9edf5; --dim:#8a94a8; --panel:#1d2330; --bg:#141821; --accent:#5cc8ff;
    --tile1:#f7e9c8; --tile2:#e8d4a4; --tileEdge:#b89f6d; --tileInk:#3a2c18;
    --go1:#4ac06a; --go2:#2f9e4f; --goEdge:#22743a;
    --cta1:#f0b23c; --cta2:#d9912a; --ctaEdge:#a8681a;
    --glassA:.26; --glassBlur:20px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;
       padding:22px 22px 110px;display:flex;gap:26px;justify-content:center;
       align-items:flex-start;flex-wrap:wrap}
  h1{font-size:15px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 16px}

  #ui{position:absolute;inset:0;z-index:3;padding:15px;display:flex;
      flex-direction:column;justify-content:flex-end}
  .bloom{position:absolute;inset:0;z-index:2;
    background:radial-gradient(ellipse 84% 40% at 50% 74%,rgba(10,34,60,.30),transparent 76%)}

  .glass{background:rgba(14,44,76,var(--glassA));
    -webkit-backdrop-filter:blur(var(--glassBlur)) saturate(1.3);
    backdrop-filter:blur(var(--glassBlur)) saturate(1.3)}
  .card{position:relative;z-index:4;border:1px solid rgba(255,255,255,.28);
    border-radius:22px;padding:14px;margin-bottom:20px;
    box-shadow:0 12px 30px rgba(8,28,52,.38)}

  .lt{width:31px;height:31px;border-radius:6px;position:relative;
    background:linear-gradient(var(--tile1),var(--tile2));
    box-shadow:0 2px 0 var(--tileEdge),0 4px 7px rgba(0,0,0,.3);
    color:var(--tileInk);font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center}
  .lt i{position:absolute;right:3px;bottom:1px;font-size:7.5px;font-style:normal;opacity:.6}
  .word{display:flex;gap:3px;justify-content:center;margin:-32px 0 13px}
  .word .lt:nth-child(odd){transform:rotate(-2deg)}
  .word .lt:nth-child(even){transform:rotate(2deg)}

  .btn{height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.36);
       background:rgba(10,38,68,.26);font-size:15px;font-weight:700;color:#fff;
       display:flex;align-items:center;justify-content:center;gap:8px;
       text-shadow:0 1px 2px rgba(0,20,40,.4);cursor:pointer}
  .btn.cta{background:linear-gradient(var(--cta1),var(--cta2));border-color:var(--ctaEdge);
    color:#3a2508;text-shadow:0 1px 1px rgba(255,255,255,.35);
    box-shadow:0 3px 0 var(--ctaEdge),0 6px 12px rgba(90,60,10,.3)}
  .btn.go{background:linear-gradient(var(--go1),var(--go2));border-color:var(--goEdge);
    box-shadow:0 3px 0 var(--goEdge),0 6px 12px rgba(20,90,45,.34)}
  .btn.small{height:38px;font-size:13px;border-radius:12px}
  .btn.wide{width:100%}
  .row{display:flex;gap:9px}
  .row > *{flex:1}
  .stack > * + *{margin-top:10px}

  .hint{margin:0 0 12px;font-size:12px;text-align:center;color:rgba(255,255,255,.84);
        text-shadow:0 1px 3px rgba(0,22,44,.6)}

  /* big tile-faced choices */
  .choice{flex:1;border-radius:16px;padding:14px 10px 12px;cursor:pointer;text-align:center;
    background:linear-gradient(var(--tile1),var(--tile2));color:var(--tileInk);
    border:1px solid var(--tileEdge);
    box-shadow:0 4px 0 var(--tileEdge),0 7px 13px rgba(0,0,0,.3)}
  .choice .big{font-size:30px;line-height:1.1}
  .choice b{display:block;font-size:15px;margin-top:5px}
  .choice span{display:block;font-size:10.5px;opacity:.72;margin-top:1px}
  .choice.off{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);
    border-color:rgba(255,255,255,.3);box-shadow:none}

  /* tile tabs, same as the pregame card */
  .tabs{display:flex;gap:7px;margin-bottom:13px}
  .ttab{flex:1;height:40px;border-radius:9px;font-size:13.5px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,38,68,.30);border:1px solid rgba(255,255,255,.3);
    color:rgba(255,255,255,.8)}
  .ttab.on{background:linear-gradient(var(--tile1),var(--tile2));color:var(--tileInk);
    border-color:var(--tileEdge);box-shadow:0 3px 0 var(--tileEdge)}

  /* difficulty chips */
  .diff{display:flex;gap:7px;margin-bottom:11px}
  .chip{flex:1;height:52px;border-radius:11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,38,68,.30);border:1px solid rgba(255,255,255,.28);
    color:rgba(255,255,255,.86);font-size:12px;font-weight:700}
  .chip small{font-size:9px;opacity:.6;font-weight:600}
  .chip.on{background:linear-gradient(var(--tile1),var(--tile2));color:var(--tileInk);
    border-color:var(--tileEdge);box-shadow:0 3px 0 var(--tileEdge)}

  .panel{width:360px;background:var(--panel);border-radius:14px;padding:15px 17px}
  .panel + .panel{margin-top:13px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 9px}
  .why{font-size:13px;margin:0 0 10px}
  .why b{color:var(--accent)}
  ul{margin:0;padding-left:17px;font-size:12.5px;color:#c3cede}
  li{margin-bottom:5px}

  #switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:4px;background:#fff;color:#111;border-radius:999px;
    padding:6px 8px;box-shadow:0 10px 32px rgba(0,0,0,.55);font-weight:700}
  #switcher button{background:transparent;border:none;color:#111;font-size:18px;
    padding:2px 12px;border-radius:999px;cursor:pointer;line-height:1}
  #vlabel{padding:0 10px;font-size:13.5px;min-width:250px;text-align:center}
  #vlabel small{display:block;font-weight:500;color:#667;font-size:11px}
</style>
</head>
<body>

<div>
  <h1>Option panel — Solo or Multiplayer</h1>
  <p class="sub">← → switches variant · the choices are clickable</p>
  <div id="phone"><div class="bloom"></div><div id="ui"></div></div>
</div>

<div>
  <div class="panel">
    <h2 id="vtitle">Variant</h2>
    <p class="why" id="vwhy"></p>
    <ul id="vpoints"></ul>
  </div>
  <div class="panel">
    <h2>Controls it carries</h2>
    <ul id="vctl"></ul>
  </div>
</div>

<div id="switcher">
  <button id="prev">&lsaquo;</button><div id="vlabel"></div><button id="next">&rsaquo;</button>
</div>

<script>
const ui=document.getElementById('ui');
let MODE='solo', DIFF='medium';

const PTS={S:1,C:3,R:1,A:1,B:3,Y:4};
const tiles=w=>'<div class="word">'+w.split('').map(
  c=>'<div class="lt">'+c+'<i>'+(PTS[c]||1)+'</i></div>').join('')+'</div>';

const DIFFS=[['easy','Easy','gentle'],['medium','Medium','fair'],
             ['hard','Hard','sharp'],['expert','Expert','brutal']];

function diffRow(){
  return '<div class="diff">'+DIFFS.map(function(d){
    return '<div class="chip '+(DIFF===d[0]?'on':'')+'" data-d="'+d[0]+'">'+
           d[1]+'<small>'+d[2]+'</small></div>';
  }).join('')+'</div>';
}

const V={};

V['1']={
  name:'Two stacked actions',
  why:'The pregame card\'s own shape, reused. Two full-width buttons, one above the other, with Solo carrying the amber because <b>it is the one that starts a game right now</b> - multiplayer has to go and find an opponent first.',
  points:['Identical construction to the pregame card, so nothing new to build.',
          'Amber on Solo says "this is the quick way in" without any copy.',
          'Reads as a list rather than a choice between equals.',
          'Difficulty stays a second screen.'],
  ctl:['SoloButton','MultiplayerButton','TitleText (as the tiles)'],
  render(){
    return '<div class="card glass">'+tiles('SCRABBY')+
      '<p class="hint">a word a round, best word wins</p>'+
      '<div class="stack">'+
        '<div class="btn cta wide">Play solo</div>'+
        '<div class="btn wide">Multiplayer</div>'+
      '</div></div>';
  }
};

V['2']={
  name:'Two tile choices',
  why:'Solo and Multiplayer as <b>two big letter tiles side by side</b> - the same material the title is cut from, scaled up to thumb size. The choice reads as two equal options rather than a primary and a secondary.',
  points:['Strongest word-game read, and the biggest tap targets of the four.',
          'Side by side says "pick one", which is what this screen is for.',
          'Two cream blocks are heavy; there is no room left for a description.',
          'Needs an icon or the labels do all the work.'],
  ctl:['SoloButton','MultiplayerButton'],
  render(){
    return '<div class="card glass">'+tiles('SCRABBY')+
      '<div class="row" style="margin-bottom:4px">'+
        '<div class="choice '+(MODE==='solo'?'':'off')+'" data-m="solo">'+
          '<div class="big">&#9823;</div><b>Solo</b><span>play the computer</span></div>'+
        '<div class="choice '+(MODE==='multi'?'':'off')+'" data-m="multi">'+
          '<div class="big">&#9824;</div><b>Multiplayer</b><span>play a friend</span></div>'+
      '</div></div>';
  }
};

V['3']={
  name:'Tabs, like the pregame card',
  why:'Solo and Multiplayer as tile tabs, exactly as Sign in and Create account work next door. <b>The same control does the same job on both screens</b>, so the pattern is learned once.',
  points:['Most consistent of the four with what is already built.',
          'Leaves room under the tabs to say what each mode actually is.',
          'One green Play at the bottom, whichever tab is showing.',
          'Tabs usually switch views, not commit choices - a slight stretch here.'],
  ctl:['SoloButton / MultiplayerButton (as tabs)','a shared Play action'],
  render(){
    const solo = MODE==='solo';
    return '<div class="card glass">'+tiles('SCRABBY')+
      '<div class="tabs">'+
        '<div class="ttab '+(solo?'on':'')+'" data-m="solo">SOLO</div>'+
        '<div class="ttab '+(!solo?'on':'')+'" data-m="multi">MULTIPLAYER</div>'+
      '</div>'+
      '<p class="hint">'+(solo
        ? 'One round at a time against the computer. Pick a difficulty next.'
        : 'Invite a friend by email and play a match over several rounds.')+'</p>'+
      '<div class="btn cta wide">'+(solo?'Choose difficulty':'Find an opponent')+'</div>'+
    '</div>';
  }
};

V['4']={
  name:'Difficulty folded in',
  why:'Solo and Multiplayer as tabs, and <b>the difficulty chips live under the Solo tab</b> instead of on a screen of their own. Picking a mode and a difficulty becomes one decision on one card.',
  points:['Removes DifficultyPanel from the flow: one screen instead of two.',
          'You can see what you are about to start before you start it.',
          'Busiest of the four - four chips plus tabs plus an action.',
          'The back button that difficulty needed disappears with the screen.'],
  ctl:['SoloButton / MultiplayerButton (tabs)','Easy / Medium / Hard / Expert',
       'Play','BackButton no longer needed'],
  render(){
    const solo = MODE==='solo';
    return '<div class="card glass">'+tiles('SCRABBY')+
      '<div class="tabs">'+
        '<div class="ttab '+(solo?'on':'')+'" data-m="solo">SOLO</div>'+
        '<div class="ttab '+(!solo?'on':'')+'" data-m="multi">MULTIPLAYER</div>'+
      '</div>'+
      (solo
        ? diffRow()+'<div class="btn go wide">Play</div>'
        : '<p class="hint">Invite a friend by email and play a match over several rounds.</p>'+
          '<div class="btn cta wide">Find an opponent</div>')+
    '</div>';
  }
};

const ORDER=['1','2','3','4'];
let CUR=(function(){let v='1';try{v=new URLSearchParams(location.search).get('variant')||'1';}catch(e){}
  return ORDER.indexOf(v)>=0?v:'1';})();

function render(){
  const v=V[CUR];
  ui.innerHTML=v.render();
  ui.querySelectorAll('[data-m]').forEach(function(el){
    el.onclick=function(){MODE=el.dataset.m;render();};
  });
  ui.querySelectorAll('[data-d]').forEach(function(el){
    el.onclick=function(){DIFF=el.dataset.d;render();};
  });
  document.getElementById('vtitle').textContent='Variant '+CUR+' — '+v.name;
  document.getElementById('vwhy').innerHTML=v.why;
  document.getElementById('vpoints').innerHTML=v.points.map(p=>'<li>'+p+'</li>').join('');
  document.getElementById('vctl').innerHTML=v.ctl.map(c=>'<li>'+c+'</li>').join('');
  document.getElementById('vlabel').innerHTML=CUR+' — '+v.name+
    '<small>variant '+(ORDER.indexOf(CUR)+1)+' of 4 · '+MODE+
    (CUR==='4'&&MODE==='solo'?' / '+DIFF:'')+'</small>';
  try{const u=new URL(location.href);u.searchParams.set('variant',CUR);
      history.replaceState(null,'',u);}catch(e){}
}
function cycle(s){CUR=ORDER[(ORDER.indexOf(CUR)+s+ORDER.length)%ORDER.length];render();}
document.getElementById('prev').onclick=function(){cycle(-1);};
document.getElementById('next').onclick=function(){cycle(1);};
addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
});
render();
</script>
</body>
</html>
