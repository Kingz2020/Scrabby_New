<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — turn indicator</title>
<!--
  THROWAWAY PROTOTYPE. Not shipped code. Double-click to run.

  Replacing the round message. Four ways to say whose turn it is and what the
  game is doing, given that the board already says everything else.

  ?variant=1|2|3|4 or the bar at the bottom. The state buttons on the right
  step through every message the round text currently carries that is NOT
  already shown elsewhere.

  Redundant today, and dropped in all four:
    "You played GRAIN for 14 points"   - HighlightPlayedWord boxes it and pins the score
    "X wins the round for N points"    - the replay shows this
    "Invalid move. Try again."         - HighlightRejectedWord already outlines it red
    "...Press EndTurn."                - the button is right there
-->
<style>
  :root{
    --ink:#e9edf5; --dim:#8a94a8; --panel:#1d2330; --bg:#141821; --accent:#5cc8ff;
    --tile1:#f7e9c8; --tile2:#e8d4a4; --tileEdge:#b89f6d; --tileInk:#3a2c18;
    --sky:#8ec6f0; --cell:#eef1f5;
    --go1:#4ac06a; --go2:#2f9e4f; --goEdge:#22743a;
    --warn:#f0b23c; --bad:#d62628;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;
       padding:22px 22px 110px;display:flex;gap:26px;justify-content:center;
       align-items:flex-start;flex-wrap:wrap}
  h1{font-size:15px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin:0 0 16px}

  #phone{position:relative;width:324px;height:684px;border-radius:26px;overflow:hidden;
    background:linear-gradient(#7fbdee,#a9d4f4 45%,#8ec6f0);
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .el{position:absolute}

  /* header */
  .hdr{display:flex;justify-content:space-around;align-items:flex-start;
       width:100%;padding:0 14px;color:#fff;text-shadow:0 1px 3px rgba(0,30,60,.45)}
  .hdr div{text-align:center}
  .hdr b{display:block;font-size:9px;letter-spacing:.09em;opacity:.8}
  .hdr span{display:block;font-size:14px;font-weight:800}
  .hdr .live{position:relative}
  .hdr .live::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    width:26px;height:3px;border-radius:2px;background:var(--go1);
    box-shadow:0 0 8px rgba(74,192,106,.9)}

  .board{background:rgba(255,255,255,.18);border-radius:9px}
  .cellbox{position:absolute;background:var(--cell);border-radius:3px;opacity:.94}
  .rack{background:linear-gradient(#fdfdfe,#e9edf2);border:2px solid #9fadc0;
    border-radius:11px;display:flex;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);transition:opacity .3s,filter .3s}
  .rack.off{opacity:.45;filter:grayscale(.65)}
  .tile{background:linear-gradient(var(--tile1),var(--tile2));border-radius:4px;
    box-shadow:0 1px 0 var(--tileEdge);color:var(--tileInk);font-weight:800;
    display:flex;align-items:center;justify-content:center}
  .btn3{background:linear-gradient(#fdfdfe,#e9edf2);border:2px solid #9fadc0;border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#2a2c30;
    transition:opacity .3s,filter .3s}
  .btn3.off{opacity:.4;filter:grayscale(.7)}

  /* 1: pill where the round message was */
  .pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;
    border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;
    background:rgba(10,38,68,.42);color:#fff;border:1px solid rgba(255,255,255,.3);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 4px 12px rgba(8,28,52,.3)}
  .pill.you{background:linear-gradient(var(--tile1),var(--tile2));color:var(--tileInk);
    border-color:var(--tileEdge);box-shadow:0 3px 0 var(--tileEdge)}
  .pill.bad{background:rgba(214,38,40,.85);border-color:rgba(255,160,160,.6)}
  .pill.ok{background:linear-gradient(var(--go1),var(--go2));border-color:var(--goEdge)}
  .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;
    animation:blink 1.1s infinite}
  .dot:nth-child(2){animation-delay:.18s}
  .dot:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* 3: banner on the rack */
  .rackband{position:absolute;left:0;right:0;top:-13px;display:flex;justify-content:center}
  .rackband .pill{height:26px;font-size:11px;padding:0 12px}

  /* 4: no text - the avatar tile marks who is up */
  .marker{width:34px;height:34px;border-radius:7px;position:relative;
    background:linear-gradient(var(--tile1),var(--tile2));
    box-shadow:0 2px 0 var(--tileEdge),0 4px 9px rgba(0,0,0,.3);
    color:var(--tileInk);font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center}
  .marker.think{background:rgba(10,38,68,.5);color:#fff;box-shadow:0 0 0 2px rgba(240,178,60,.8)}
  .marker i{position:absolute;right:3px;bottom:1px;font-size:7px;font-style:normal;opacity:.6}

  .panel{width:360px;background:var(--panel);border-radius:14px;padding:15px 17px}
  .panel + .panel{margin-top:13px}
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 9px}
  .why{font-size:13px;margin:0 0 10px}
  .why b{color:var(--accent)}
  ul{margin:0;padding-left:17px;font-size:12.5px;color:#c3cede}
  li{margin-bottom:5px}
  .states{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
  .states button{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);
    background:#2f3850;border:1px solid #414d69;border-radius:8px;padding:5px 9px;cursor:pointer}
  .states button.on{background:var(--accent);border-color:var(--accent);color:#08243d}

  #switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:4px;background:#fff;color:#111;border-radius:999px;
    padding:6px 8px;box-shadow:0 10px 32px rgba(0,0,0,.55);font-weight:700}
  #switcher button{background:transparent;border:none;color:#111;font-size:18px;
    padding:2px 12px;border-radius:999px;cursor:pointer;line-height:1}
  #vlabel{padding:0 10px;font-size:13.5px;min-width:250px;text-align:center}
  #vlabel small{display:block;font-weight:500;color:#667;font-size:11px}
</style>
</head>
<body>

<div>
  <h1>Turn indicator — replacing the round message</h1>
  <p class="sub">← → switches variant · step through the states on the right</p>
  <div id="phone"></div>
</div>

<div>
  <div class="panel">
    <h2 id="vtitle">Variant</h2>
    <div class="states" id="states"></div>
    <p class="why" id="vwhy"></p>
    <ul id="vpoints"></ul>
  </div>
  <div class="panel">
    <h2>Round messages this replaces</h2>
    <ul id="vctl"></ul>
  </div>
</div>

<div id="switcher">
  <button id="prev">&lsaquo;</button><div id="vlabel"></div><button id="next">&rsaquo;</button>
</div>

<script>
const CW=1080, CH=2280, S=0.30;
const phone=document.getElementById('phone');
phone.style.width=(CW*S)+'px'; phone.style.height=(CH*S)+'px';

function box(e,cls){
  const d=document.createElement('div');
  d.className='el '+(cls||'');
  d.style.left=(CW/2+e.x-e.w/2)*S+'px';
  d.style.top=(CH/2-e.y-e.h/2)*S+'px';
  d.style.width=e.w*S+'px'; d.style.height=e.h*S+'px';
  phone.appendChild(d); return d;
}

// every state the round text carries that nothing else on screen says
const STATES=[
  ['you',   'Your turn',            'you'],
  ['think', 'AI is thinking',       'wait'],
  ['check', 'Checking your word',   'wait'],
  ['submit','Move submitted',       'ok'],
  ['wait',  'Waiting for Ravi',     'wait'],
  ['bad',   'Not a word',           'bad']
];
let ST='you';
const cur=()=>STATES.find(s=>s[0]===ST);
const isYours=()=>ST==='you';

function dots(){return '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';}

function pill(extraClass){
  const [k,label,kind]=cur();
  const cls = kind==='you'?'you':(kind==='bad'?'bad':(kind==='ok'?'ok':''));
  const busy = (k==='think'||k==='check'||k==='wait');
  return '<div class="pill '+cls+' '+(extraClass||'')+'">'+label+(busy?dots():'')+'</div>';
}

function header(live){
  const cells=[['ROUND','1 / 4',''],['TIME','70',''],
               ['HUMAN','0',live==='you'?'live':''],
               ['AI','0',live==='ai'?'live':'']];
  return '<div class="hdr">'+cells.map(c=>
    '<div class="'+c[2]+'"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('')+'</div>';
}

function drawBoard(){
  const b=box({x:0,y:32.8,w:1000,h:980},'board');
  const n=9, pad=14, cell=(1000-pad*2-6*(n-1))/n;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const t=document.createElement('div');
    t.className='cellbox';
    t.style.left=(pad+c*(cell+6))*S+'px'; t.style.top=(pad+r*(cell+6))*S+'px';
    t.style.width=cell*S+'px'; t.style.height=cell*S+'px';
    b.appendChild(t);
  }
}

function drawRack(dim){
  const r=box({x:0,y:-580,w:1000,h:180},'rack'+(dim?' off':''));
  for(let i=0;i<7;i++){
    const t=document.createElement('div');
    t.className='tile';
    t.style.width=(100*S)+'px'; t.style.height=(100*S)+'px';
    t.style.fontSize=(100*S*0.5)+'px';
    t.textContent='SCRABBY'[i];
    r.appendChild(t);
  }
  return r;
}

function drawButtons(dim){
  const d=dim?' off':'';
  box({x:-350,y:-800,w:190,h:140},'btn3'+d).textContent='⌄⌄';
  box({x:-140,y:-800,w:190,h:140},'btn3'+d).textContent='⇄';
  box({x:255,y:-800,w:380,h:140},'btn3'+d).textContent='▶';
}

const V={};

V['1']={
  name:'Pill where the message was',
  why:'A single chip in the same slot the round message occupies now, but carrying <b>state only</b> - never a result, never an instruction. Cream when it is your move, glass with animated dots while the game is busy, red for a beat when a word is turned down.',
  points:['Smallest change: one text object becomes one pill, in place.',
          'Cream face means "you", matching the tiles you are about to play.',
          'The dots do the work "..." was doing, without the sentence.',
          'Still a strip of chrome between the header and the board.'],
  render(){
    phone.innerHTML='';
    const h=box({x:0,y:960,w:1080,h:120}); h.innerHTML=header(isYours()?'you':'ai');
    const p=box({x:0,y:700,w:1080,h:90});
    p.style.display='flex'; p.style.alignItems='center'; p.style.justifyContent='center';
    p.innerHTML=pill();
    drawBoard(); drawRack(false); drawButtons(false);
  }
};

V['2']={
  name:'Folded into the header',
  why:'No strip at all. The header already names both players and their scores, so <b>the active one is simply marked</b> - a green underline under whoever the game is waiting on, and the state spelled out only while something is happening.',
  points:['Reclaims the whole strip: the board can sit higher or grow.',
          'Whose turn it is lives next to the score, which is where you look anyway.',
          'A thin underline is easy to miss on a busy background.',
          'Still needs somewhere for "Not a word" to go.'],
  render(){
    phone.innerHTML='';
    const h=box({x:0,y:960,w:1080,h:120}); h.innerHTML=header(isYours()?'you':'ai');
    if(!isYours() || ST==='bad'){
      const p=box({x:0,y:830,w:1080,h:60});
      p.style.display='flex'; p.style.alignItems='center'; p.style.justifyContent='center';
      p.innerHTML=pill();
    }
    drawBoard(); drawRack(false); drawButtons(false);
  }
};

V['3']={
  name:'On the rack',
  why:'The state sits on the edge of the tile rack, <b>where your hands and eyes already are</b>. When it is not your move the rack and the buttons dim, so the screen itself says wait rather than telling you to.',
  points:['Closest to the thing you act on, so it is read without hunting.',
          'Dimming answers "can I do anything right now?" before any word is read.',
          'The strip above the board disappears entirely.',
          'A label on the rack competes with the tiles for attention.'],
  render(){
    phone.innerHTML='';
    const h=box({x:0,y:960,w:1080,h:120}); h.innerHTML=header(isYours()?'you':'ai');
    drawBoard();
    const r=drawRack(!isYours());
    const band=document.createElement('div');
    band.className='rackband'; band.innerHTML=pill();
    r.appendChild(band);
    drawButtons(!isYours());
  }
};

V['4']={
  name:'No words at all',
  why:'A letter tile marks who the game is waiting on - your initial when it is you, the opponent’s with a warm ring while they think. <b>The rack and buttons dim when you cannot act.</b> Nothing to translate, nothing to read.',
  points:['No copy to write, and nothing to translate later.',
          'Uses the tile you already ship as the marker.',
          '"Not a word" still needs the red outline to carry it alone.',
          'A first-time player may not know what the ring means.'],
  render(){
    phone.innerHTML='';
    const h=box({x:0,y:960,w:1080,h:120}); h.innerHTML=header(isYours()?'you':'ai');
    const m=box({x:0,y:760,w:1080,h:130});
    m.style.display='flex'; m.style.alignItems='center'; m.style.justifyContent='center';
    const you=isYours();
    m.innerHTML='<div class="marker '+(you?'':'think')+'">'+(you?'K':'R')+
      '<i>'+(you?5:1)+'</i></div>';
    drawBoard(); drawRack(!you); drawButtons(!you);
  }
};

const ORDER=['1','2','3','4'];
let CUR=(function(){let v='1';try{v=new URLSearchParams(location.search).get('variant')||'1';}catch(e){}
  return ORDER.indexOf(v)>=0?v:'1';})();

const MSG=['"AI is thinking..."','"Waiting for Player 2 move..."',
  '"Waiting for online opponent move..."','"Waiting for other players..."',
  '"Checking your word..."','"Submitting move..."','"Move submitted!"',
  '"Player 2: build your word, then press EndTurn."'];

function render(){
  const v=V[CUR];
  v.render();
  document.getElementById('states').innerHTML=STATES.map(s=>
    '<button data-s="'+s[0]+'" class="'+(s[0]===ST?'on':'')+'">'+s[1]+'</button>').join('');
  document.querySelectorAll('#states button').forEach(b=>
    b.onclick=()=>{ST=b.dataset.s;render();});
  document.getElementById('vtitle').textContent='Variant '+CUR+' — '+v.name;
  document.getElementById('vwhy').innerHTML=v.why;
  document.getElementById('vpoints').innerHTML=v.points.map(p=>'<li>'+p+'</li>').join('');
  document.getElementById('vctl').innerHTML=MSG.map(m=>'<li>'+m+'</li>').join('');
  document.getElementById('vlabel').innerHTML=CUR+' — '+v.name+
    '<small>variant '+(ORDER.indexOf(CUR)+1)+' of 4 · '+cur()[1]+'</small>';
  try{const u=new URL(location.href);u.searchParams.set('variant',CUR);
      history.replaceState(null,'',u);}catch(e){}
}
function cycle(s){CUR=ORDER[(ORDER.indexOf(CUR)+s+ORDER.length)%ORDER.length];render();}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')cycle(-1); if(e.key==='ArrowRight')cycle(1);
});
render();
</script>
</body>
</html>
